services:
  mysql:
    image: mysql:8.0
    container_name: bd_sistemas_ventas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: useradmin
      MYSQL_USER: useradmin123
      MYSQL_PASSWORD: u&466seradmin
    ports:
      - "3308:3306"
    volumes:
      - bd_sistemas_ventas_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bd_sistemas_ventas_data: